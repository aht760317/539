<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>539 / 天天樂 雲端行動操盤 APP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; background-color: #f1f5f9; }
    .ball-btn { touch-action: manipulation; }
    .ball-btn.active {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #b91c1c !important;
      transform: scale(1.08);
      box-shadow: 0 4px 8px rgba(239, 68, 68, 0.4);
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* 隱藏滾動條但可滾動 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 font-sans pb-20">
  
  <!-- 頂部標題列 (固定) -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-black tracking-wide flex items-center gap-2">
          539 / 天天樂 操盤系統
        </h1>
        <div class="text-[10px] text-slate-400 mt-0.5">2星賺7.5%｜3星賺7%｜4星賺20%｜車賺95</div>
      </div>
      <div id="cloudStatus" class="text-[10px] font-bold px-2.5 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full flex items-center gap-1">
        <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>已同步
      </div>
    </div>
    <!-- 玩法切換 (Segmented Control) -->
    <div class="bg-slate-800 px-4 py-2">
      <div class="flex rounded-lg bg-slate-900 p-1 text-sm font-semibold border border-slate-700">
        <button id="tabStarBtn" onclick="window.switchTab('star')" class="flex-1 py-1.5 rounded-md bg-blue-600 text-white shadow transition">二三四星</button>
        <button id="tabCarBtn" onclick="window.switchTab('car')" class="flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition">全車 (坐車)</button>
      </div>
    </div>
  </header>

  <div class="max-w-2xl mx-auto p-3 space-y-4 mt-2">

    <!-- 🎯 智能開盤輸入區 -->
    <section class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-black text-slate-800 flex items-center gap-1.5">
          <span class="text-emerald-500 text-lg">🎯</span> 開獎對獎區
        </h2>
        <span class="text-[10px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded">連打數字自動拆分</span>
      </div>
      <input type="text" id="smartDrawInput" inputmode="numeric" 
             class="w-full text-center text-xl font-black tracking-[0.3em] py-2.5 border-2 border-emerald-100 rounded-xl focus:border-emerald-500 focus:outline-none bg-emerald-50/30 text-emerald-900 placeholder:text-emerald-300 placeholder:text-xs placeholder:tracking-normal transition-all" 
             placeholder="例: 0512182539" 
             oninput="window.parseDrawNumbers()">
      <div id="drawVisual" class="flex gap-2 justify-center mt-3 h-10">
        <!-- JS 動態生成球 -->
      </div>
    </section>

    <!-- ===================================== -->
    <!-- 模組一：連碰 (2星 / 3星 / 4星) -->
    <!-- ===================================== -->
    <main id="starSection" class="space-y-4">
      
      <!-- 顧客與面額設定卡片 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
        <div class="flex gap-2 mb-3">
          <input id="starBetDate" type="date" class="border border-slate-200 rounded-lg p-2 text-xs font-bold bg-slate-50 w-32 outline-none focus:border-blue-400">
          <input id="starCustName" type="text" placeholder="輸入客名" class="border border-slate-200 rounded-lg p-2 text-xs font-bold flex-1 outline-none focus:border-blue-400">
        </div>
        
        <div class="flex items-center justify-between bg-blue-50/50 p-2 rounded-xl border border-blue-100">
          <span class="text-xs text-blue-800 font-bold ml-1">統一面額設定</span>
          <div class="flex items-center gap-1">
            <input id="batchUnitPrice" type="number" inputmode="decimal" value="100" class="w-16 p-1.5 border border-blue-200 rounded-lg text-center font-bold text-sm bg-white outline-none">
            <button onclick="window.applyBatchUnitPrice()" class="px-3 py-1.5 bg-blue-600 active:bg-blue-700 text-white rounded-lg font-bold text-xs shadow-sm">套用</button>
          </div>
        </div>

        <!-- 各星別獨立勾選與面額 -->
        <div class="mt-3 space-y-2">
          <!-- 2星 -->
          <div class="flex items-center justify-between bg-slate-50 border border-slate-100 rounded-xl p-2.5">
            <label class="flex items-center gap-2 text-sm font-black text-slate-800">
              <input id="chk2Star" type="checkbox" checked onchange="window.calculateStars()" class="w-4 h-4 text-blue-600 rounded"> 
              2星 <span class="text-[10px] text-slate-400 font-normal">賺7.5%</span>
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[10px] text-slate-400">面額</span>
              <input id="unit2Star" type="number" inputmode="decimal" value="100" class="w-14 p-1 border rounded bg-white text-center text-sm font-bold" onchange="window.calculateStars()">
            </div>
          </div>
          <!-- 3星 -->
          <div class="flex items-center justify-between bg-slate-50 border border-slate-100 rounded-xl p-2.5">
            <label class="flex items-center gap-2 text-sm font-black text-slate-800">
              <input id="chk3Star" type="checkbox" checked onchange="window.calculateStars()" class="w-4 h-4 text-blue-600 rounded"> 
              3星 <span class="text-[10px] text-slate-400 font-normal">賺7.0%</span>
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[10px] text-slate-400">面額</span>
              <input id="unit3Star" type="number" inputmode="decimal" value="100" class="w-14 p-1 border rounded bg-white text-center text-sm font-bold" onchange="window.calculateStars()">
            </div>
          </div>
          <!-- 4星 -->
          <div class="flex items-center justify-between bg-slate-50 border border-slate-100 rounded-xl p-2.5">
            <label class="flex items-center gap-2 text-sm font-black text-slate-800">
              <input id="chk4Star" type="checkbox" checked onchange="window.calculateStars()" class="w-4 h-4 text-blue-600 rounded"> 
              4星 <span class="text-[10px] text-slate-400 font-normal">賺20%</span>
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[10px] text-slate-400">面額</span>
              <input id="unit4Star" type="number" inputmode="decimal" value="100" class="w-14 p-1 border rounded bg-white text-center text-sm font-bold" onchange="window.calculateStars()">
            </div>
          </div>
          <!-- 4星專屬賠率燈號 -->
          <div id="oddsAlert4" class="text-[10px] text-rose-500 font-bold px-1 text-right transition-all">⚠️ 四星賠率：7,500 倍 (≤2000碰)</div>
        </div>
      </div>

      <!-- 號碼鍵盤區 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-bold text-slate-800">👇 點擊選擇號碼</span>
          <button onclick="window.clearStarBalls()" class="text-xs px-3 py-1.5 bg-slate-100 text-slate-600 font-bold rounded-lg active:bg-slate-200">清空</button>
        </div>
        <!-- 手機最佳化號碼盤 -->
        <div id="starBallSelector" class="grid grid-cols-7 gap-1.5"></div>
      </div>

      <!-- 📊 APP 卡片化對帳結果 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <h3 class="font-black text-slate-800 text-sm">連碰對帳明細</h3>
          <span id="starSelectionDisplay" class="text-xs text-slate-500 font-bold bg-slate-100 px-2 py-0.5 rounded-full">未選號</span>
        </div>

        <!-- 動態生成的星別卡片區 -->
        <div id="starCalculationCards" class="space-y-3 mb-4">
          <!-- JS 注入卡片 -->
        </div>

        <!-- 總計結算 -->
        <div class="bg-slate-800 text-white p-3 rounded-xl flex justify-between items-center shadow-inner">
          <div>
            <div class="text-[10px] text-slate-400">向客總收 (<span id="starTotalPairs" class="text-slate-300">0碰</span>)</div>
            <div id="starTotalCollect" class="text-lg font-black text-blue-300">0 元</div>
          </div>
          <div class="text-right">
            <div class="text-[10px] text-slate-400">淨賺水錢利潤</div>
            <div id="starTotalWater" class="text-xl font-black text-emerald-400">0 元</div>
          </div>
        </div>

        <!-- 中獎總彩金 (如果有中) -->
        <div id="starTotalPayoutWrapper" class="hidden mt-2 bg-rose-50 border border-rose-200 p-3 rounded-xl flex justify-between items-center">
          <div class="text-rose-600 font-bold text-xs">🎉 應發總彩金</div>
          <div id="starTotalPayout" class="text-lg font-black text-rose-600">0 元</div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-4">
          <button onclick="window.saveStarBetRecord()" class="col-span-2 py-3 bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-1 shadow">☁️ 存入雲端帳本</button>
          <button onclick="window.copyStarBetSummary()" class="py-2.5 bg-slate-100 text-slate-700 border border-slate-300 active:bg-slate-200 font-bold rounded-xl text-xs flex items-center justify-center">📋 複製下注單</button>
          <button onclick="window.copyStarPayoutSummary()" class="py-2.5 bg-rose-50 text-rose-600 border border-rose-200 active:bg-rose-100 font-bold rounded-xl text-xs flex items-center justify-center">💰 複製派彩單</button>
        </div>
      </div>
    </main>

    <!-- ===================================== -->
    <!-- 模組二：坐車 (全車 2850/2755/95) -->
    <!-- ===================================== -->
    <main id="carSection" class="space-y-4 hidden">
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
        <div class="flex gap-2 mb-3">
          <input id="carBetDate" type="date" class="border border-slate-200 rounded-lg p-2 text-xs font-bold bg-slate-50 w-32 outline-none">
          <input id="carCustName" type="text" placeholder="輸入客名" class="border border-slate-200 rounded-lg p-2 text-xs font-bold flex-1 outline-none">
        </div>
        
        <!-- 號碼鍵盤區 -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-bold text-slate-800">👇 點擊選擇號碼</span>
            <button onclick="window.clearCarSelector()" class="text-xs px-3 py-1.5 bg-slate-100 text-slate-600 font-bold rounded-lg active:bg-slate-200">清空</button>
          </div>
          <div id="carBallSelector" class="grid grid-cols-7 gap-1.5"></div>
        </div>

        <div class="mt-4 flex flex-col gap-2 bg-blue-50/50 p-3 rounded-xl border border-blue-100">
          <div class="text-[11px] text-slate-600 font-bold">
            已選：<span id="carSelectedNums" class="text-blue-700">無</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-700 whitespace-nowrap">每顆各下</span>
            <input id="carDefaultPerBall" type="number" inputmode="decimal" step="0.05" value="0.3" class="w-full p-2 border border-blue-200 rounded-lg font-bold text-center text-sm bg-white outline-none">
            <span class="text-xs font-bold text-slate-700">車</span>
            <button onclick="window.addSelectedCarsBatch()" class="px-4 py-2 bg-blue-600 active:bg-blue-700 text-white font-bold text-xs rounded-lg shadow whitespace-nowrap">加入清單</button>
          </div>
        </div>
      </div>

      <!-- 坐車卡片化清單對帳 -->
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <h3 class="font-black text-slate-800 text-sm">坐車清單試算</h3>
          <button onclick="window.clearCarBets()" class="text-xs text-rose-500 font-bold">清空列表</button>
        </div>

        <div id="carCalculationCards" class="space-y-2 mb-4">
          <!-- JS 動態生成坐車卡片 -->
        </div>

        <!-- 總計結算 -->
        <div class="bg-slate-800 text-white p-3 rounded-xl flex justify-between items-center shadow-inner">
          <div>
            <div class="text-[10px] text-slate-400">向客總收 (<span id="carTotalCars" class="text-slate-300">0車</span>)</div>
            <div id="carTotalCollect" class="text-lg font-black text-blue-300">0 元</div>
          </div>
          <div class="text-right">
            <div class="text-[10px] text-slate-400">淨賺水錢利潤</div>
            <div id="carTotalWater" class="text-xl font-black text-emerald-400">0 元</div>
          </div>
        </div>

        <!-- 中獎總彩金 -->
        <div id="carTotalPayoutWrapper" class="hidden mt-2 bg-rose-50 border border-rose-200 p-3 rounded-xl flex justify-between items-center">
          <div class="text-rose-600 font-bold text-xs">🎉 應發總彩金</div>
          <div id="carTotalPayout" class="text-lg font-black text-rose-600">0 元</div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-4">
          <button onclick="window.saveCarBetRecord()" class="col-span-2 py-3 bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-1 shadow">☁️ 存入雲端帳本</button>
          <button onclick="window.copyCarBetSummary()" class="py-2.5 bg-slate-100 text-slate-700 border border-slate-300 active:bg-slate-200 font-bold rounded-xl text-xs flex items-center justify-center">📋 複製下注單</button>
          <button onclick="window.copyCarPayoutSummary()" class="py-2.5 bg-rose-50 text-rose-600 border border-rose-200 active:bg-rose-100 font-bold rounded-xl text-xs flex items-center justify-center">💰 複製派彩單</button>
        </div>
      </div>
    </main>

    <!-- ===================================== -->
    <!-- 模組三：雲端流水帳本 (APP卡片版) -->
    <!-- ===================================== -->
    <section class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b pb-3 mb-3">
        <div>
          <h2 class="text-sm font-black text-slate-900 flex items-center gap-1.5">
            ☁️ 雲端帳目明細
          </h2>
        </div>
        <div class="flex items-center gap-1.5">
          <input id="ledgerFilterDate" type="date" class="border border-slate-200 rounded-lg p-2 text-xs font-bold bg-slate-50 outline-none" onchange="window.renderLedger()">
          <button onclick="window.resetLedgerFilter()" class="bg-slate-100 active:bg-slate-200 px-3 py-2 rounded-lg text-slate-600 font-bold text-xs">看全部</button>
        </div>
      </div>

      <!-- 當日總計 -->
      <div class="flex justify-between items-center bg-blue-50/50 p-3 rounded-xl border border-blue-100 mb-4">
        <div>
          <div class="text-[10px] text-slate-500">總實收 (<span id="ledgerCountDisplay" class="font-bold">0筆</span>)</div>
          <div id="ledgerCollectDisplay" class="text-base font-black text-blue-700">0 元</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-500">總實賺水錢</div>
          <div id="ledgerWaterDisplay" class="text-xl font-black text-emerald-600">0 元</div>
        </div>
      </div>

      <!-- 流水卡片列表 -->
      <div id="ledgerCardList" class="space-y-3">
        <!-- JS 動態生成歷史卡片 -->
      </div>
    </section>

  </div>

  <!-- Firebase 雲端邏輯模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
      collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC9A3HggBSJg2RJJpHEb10Fkf4S6cNqgmE",
      authDomain: "gogogo539.firebaseapp.com",
      projectId: "gogogo539",
      storageBucket: "gogogo539.firebasestorage.app",
      messagingSenderId: "1034723826496",
      appId: "1:1034723826496:web:16eee8eeeb35d53a4278a5"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });

    let ledgerRecords = [];
    let carBets = [];
    let selectedCarBalls = new Set();
    let selectedStarBalls = new Set();
    window.currentDrawnNumbers = [];

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    
    document.getElementById('starBetDate').value = getTodayString();
    document.getElementById('carBetDate').value = getTodayString();
    document.getElementById('ledgerFilterDate').value = getTodayString();

    const q = query(collection(db, "ledger_records"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      ledgerRecords = [];
      snapshot.forEach((doc) => { ledgerRecords.push({ id: doc.id, ...doc.data() }); });
      window.renderLedger();
    });

    window.parseDrawNumbers = function() {
      let val = document.getElementById('smartDrawInput').value;
      let matches = val.match(/\d+/g);
      let drawn = [];
      if (matches) {
        matches.forEach(m => {
          if (m.length > 2) {
            for(let i=0; i<m.length; i+=2) {
              if(drawn.length < 5) {
                let chunk = m.substring(i, i+2);
                if(chunk.length === 1) chunk = '0' + chunk;
                drawn.push(chunk);
              }
            }
          } else {
            if(drawn.length < 5) drawn.push(m.padStart(2, '0'));
          }
        });
      }
      drawn = drawn.slice(0, 5);
      window.currentDrawnNumbers = drawn;

      let visualHTML = '';
      for(let i=0; i<5; i++) {
        if(drawn[i]) {
          visualHTML += `<div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-black text-sm shadow transition-all transform scale-110">${drawn[i]}</div>`;
        } else {
          visualHTML += `<div class="w-8 h-8 rounded-full bg-slate-200 border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-400 font-bold text-xs">?</div>`;
        }
      }
      document.getElementById('drawVisual').innerHTML = visualHTML;
      window.triggerRecalculate();
    };

    window.triggerRecalculate = function() {
      window.calculateStars();
      window.renderCarBets();
    };

    window.switchTab = function(tab) {
      const carSec = document.getElementById('carSection');
      const starSec = document.getElementById('starSection');
      const carBtn = document.getElementById('tabCarBtn');
      const starBtn = document.getElementById('tabStarBtn');
      if (tab === 'star') {
        starSec.classList.remove('hidden');
        carSec.classList.add('hidden');
        starBtn.className = 'flex-1 py-1.5 rounded-md bg-blue-600 text-white shadow transition';
        carBtn.className = 'flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition bg-transparent';
      } else {
        carSec.classList.remove('hidden');
        starSec.classList.add('hidden');
        carBtn.className = 'flex-1 py-1.5 rounded-md bg-blue-600 text-white shadow transition';
        starBtn.className = 'flex-1 py-1.5 rounded-md text-slate-400 hover:text-white transition bg-transparent';
      }
    };

    function combinations(n, k) {
      if (k < 0 || k > n) return 0;
      if (k === 0 || k === n) return 1;
      let c = 1;
      for (let i = 1; i <= k; i++) c = (c * (n - (k - i))) / i;
      return Math.round(c);
    }

    function initKeypads() {
      const initPad = (containerId, toggleFn, prefix) => {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        for (let i = 1; i <= 39; i++) {
          const num = String(i).padStart(2, '0');
          const btn = document.createElement('button');
          btn.textContent = num;
          btn.id = `${prefix}-ball-${num}`;
          btn.className = 'ball-btn font-black py-2 border border-slate-200 rounded-lg text-sm transition bg-white text-slate-700 active:scale-95 shadow-sm';
          btn.onclick = () => window[toggleFn](num);
          container.appendChild(btn);
        }
      };
      initPad('starBallSelector', 'toggleStarBall', 'star');
      initPad('carBallSelector', 'toggleCarBall', 'car');
    }

    window.applyBatchUnitPrice = function() {
      const val = parseFloat(document.getElementById('batchUnitPrice').value);
      if (isNaN(val) || val <= 0) return alert('請輸入有效面額！');
      document.getElementById('unit2Star').value = val;
      document.getElementById('unit3Star').value = val;
      document.getElementById('unit4Star').value = val;
      window.calculateStars();
    };

    window.toggleStarBall = function(num) {
      if (selectedStarBalls.has(num)) {
        selectedStarBalls.delete(num);
        document.getElementById(`star-ball-${num}`).classList.remove('active');
      } else {
        selectedStarBalls.add(num);
        document.getElementById(`star-ball-${num}`).classList.add('active');
      }
      window.calculateStars();
    };

    window.clearStarBalls = function() {
      selectedStarBalls.clear();
      document.querySelectorAll('#starBallSelector .ball-btn').forEach(b => b.classList.remove('active'));
      window.calculateStars();
    };

    window.calculateStars = function() {
      const balls = Array.from(selectedStarBalls).sort((a,b) => a-b);
      const n = balls.length;

      const pairs4 = combinations(n, 4);
      const odds4 = pairs4 <= 2000 ? 7500 : 8000;

      const oddsAlert4 = document.getElementById('oddsAlert4');
      if (pairs4 <= 2000) {
        oddsAlert4.innerHTML = `⚠️ 四星賠率：7,500 倍 (≤2000碰)`;
        oddsAlert4.className = "text-[10px] text-rose-500 font-bold px-1 text-right transition-all";
      } else {
        oddsAlert4.innerHTML = `🔥 四星賠率：8,000 倍 (>2000碰)`;
        oddsAlert4.className = "text-[10px] text-emerald-600 font-bold px-1 text-right transition-all";
      }

      const rules = [
        { key: '2星', k: 2, enabled: document.getElementById('chk2Star').checked, unit: parseFloat(document.getElementById('unit2Star').value)||0, custPct: 0.80, costPct: 0.725, waterPct: 0.075, odds: 57 },
        { key: '3星', k: 3, enabled: document.getElementById('chk3Star').checked, unit: parseFloat(document.getElementById('unit3Star').value)||0, custPct: 0.70, costPct: 0.630, waterPct: 0.070, odds: 570 },
        { key: '4星', k: 4, enabled: document.getElementById('chk4Star').checked, unit: parseFloat(document.getElementById('unit4Star').value)||0, custPct: 0.70, costPct: 0.500, waterPct: 0.200, odds: odds4 }
      ];

      document.getElementById('starSelectionDisplay').textContent = n > 0 ? `已選 ${balls.length} 顆` : '未選號';

      const drawn = window.currentDrawnNumbers;
      const hits = balls.filter(b => drawn.includes(b));
      const m = hits.length;

      const cardContainer = document.getElementById('starCalculationCards');
      cardContainer.innerHTML = '';
      
      let tPairs=0, tColl=0, tCost=0, tWater=0, tPayout=0;

      rules.forEach(r => {
        if (!r.enabled) return;
        const pairs = combinations(n, r.k);
        const coll = pairs * (r.unit * r.custPct);
        const cost = pairs * (r.unit * r.costPct);
        const water = pairs * (r.unit * r.waterPct);
        const hitPairs = combinations(m, r.k);
        const prize = hitPairs * (r.unit * r.odds);

        tPairs += pairs; tColl += coll; tCost += cost; tWater += water; tPayout += prize;

        if (pairs > 0 || hitPairs > 0) {
          // APP 卡片設計
          let hitBadge = '';
          if (hitPairs > 0) {
            hitBadge = `
              <div class="mt-2 bg-rose-50 border border-rose-200 rounded-lg p-2 flex justify-between items-center shadow-sm">
                <span class="text-rose-600 font-black text-sm flex items-center gap-1">🎯 命中 ${hitPairs} 碰</span>
                <span class="text-rose-600 font-black text-base">派彩: $${Math.round(prize).toLocaleString()}</span>
              </div>
            `;
          }

          const card = document.createElement('div');
          card.className = `p-3 rounded-xl border ${hitPairs > 0 ? 'border-rose-300 bg-white shadow-md' : 'border-slate-200 bg-white shadow-sm'}`;
          card.innerHTML = `
            <div class="flex justify-between items-center mb-2">
              <span class="font-black text-slate-800 text-sm flex items-center gap-1"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> ${r.key} (面額 ${r.unit})</span>
              <span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded font-bold">${pairs} 碰</span>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100">
              <div>收: <span class="font-bold text-slate-800">$${Math.round(coll).toLocaleString()}</span></div>
              <div>本: <span class="font-bold text-slate-800">$${Math.round(cost).toLocaleString()}</span></div>
              <div class="text-emerald-600 font-black">賺: +$${Math.round(water).toLocaleString()}</div>
            </div>
            ${hitBadge}
          `;
          cardContainer.appendChild(card);
        }
      });

      if (cardContainer.innerHTML === '' && n === 0) {
        cardContainer.innerHTML = `<div class="text-center text-slate-400 text-xs py-4">請在上方點擊號碼與玩法</div>`;
      }

      document.getElementById('starTotalPairs').textContent = tPairs + ' 碰';
      document.getElementById('starTotalCollect').textContent = Math.round(tColl).toLocaleString() + ' 元';
      document.getElementById('starTotalWater').textContent = '+' + Math.round(tWater).toLocaleString() + ' 元';
      document.getElementById('starTotalPayout').textContent = Math.round(tPayout).toLocaleString() + ' 元';

      const payoutWrap = document.getElementById('starTotalPayoutWrapper');
      if (tPayout > 0) {
        payoutWrap.classList.remove('hidden');
      } else {
        payoutWrap.classList.add('hidden');
      }

      window.currentStarCalc = { balls, n, tPairs, tColl: Math.round(tColl), tCost: Math.round(tCost), tWater: Math.round(tWater), tPayout: Math.round(tPayout), hits, hitCount: m, rulesInfo: rules.filter(r=>r.enabled).map(r=>`${r.key}(${r.unit}元)`).join('+') };
    };

    window.saveStarBetRecord = async function() {
      const calc = window.currentStarCalc;
      if (!calc || calc.tPairs === 0) return alert('請先選號並勾選玩法！');
      
      const date = document.getElementById('starBetDate').value;
      const cust = document.getElementById('starCustName').value.trim() || '未具名';

      try {
        await addDoc(collection(db, "ledger_records"), {
          date: date, cust: cust, game: `連碰 [${calc.rulesInfo}]`, detail: calc.balls.join(','),
          amountLabel: `${calc.tPairs}碰`, collect: calc.tColl, cost: calc.tCost, water: calc.tWater,
          payout: calc.tPayout, createdAt: Date.now()
        });
        alert('✅ 下注已存入雲端！');
      } catch(e) {
        alert('寫入失敗，暫存於本機。');
      }
    };

    // 坐車邏輯
    window.toggleCarBall = function(num) {
      if (selectedCarBalls.has(num)) {
        selectedCarBalls.delete(num);
        document.getElementById(`car-ball-${num}`).classList.remove('active');
      } else {
        selectedCarBalls.add(num);
        document.getElementById(`car-ball-${num}`).classList.add('active');
      }
      const arr = Array.from(selectedCarBalls).sort((a,b) => a-b);
      document.getElementById('carSelectedNums').textContent = arr.length > 0 ? arr.join(', ') : '無';
    };

    window.clearCarSelector = function() {
      selectedCarBalls.clear();
      document.querySelectorAll('#carBallSelector .ball-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('carSelectedNums').textContent = '無';
    };

    window.addSelectedCarsBatch = function() {
      const amount = parseFloat(document.getElementById('carDefaultPerBall').value);
      if (selectedCarBalls.size === 0) return alert('請先點選號碼！');
      if (isNaN(amount) || amount <= 0) return alert('請輸入有效車數！');
      selectedCarBalls.forEach(num => carBets.push({ num, amount }));
      window.clearCarSelector();
      window.renderCarBets();
    };

    window.removeCarBet = function(idx) { carBets.splice(idx,1); window.renderCarBets(); };
    window.clearCarBets = function() { carBets=[]; window.renderCarBets(); };

    window.renderCarBets = function() {
      const cardContainer = document.getElementById('carCalculationCards');
      cardContainer.innerHTML = '';
      let tCars=0, tColl=0, tCost=0, tWater=0, tPayout=0;
      const drawn = window.currentDrawnNumbers;

      carBets.forEach((bet, idx) => {
        const hit = drawn.includes(bet.num);
        const coll = bet.amount * 2850;
        const cost = bet.amount * 2755;
        const water = bet.amount * 95;
        const prize = hit ? bet.amount * 21200 : 0;
        tCars += bet.amount; tColl += coll; tCost += cost; tWater += water; tPayout += prize;

        let hitBadge = '';
        if (hit) {
          hitBadge = `
            <div class="mt-2 bg-rose-50 border border-rose-200 rounded-lg p-2 flex justify-between items-center shadow-sm">
              <span class="text-rose-600 font-black text-sm flex items-center gap-1">🎯 全車開出</span>
              <span class="text-rose-600 font-black text-base">派彩: $${Math.round(prize).toLocaleString()}</span>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border ${hit ? 'border-rose-300 bg-white shadow-md' : 'border-slate-200 bg-white shadow-sm'} relative`;
        card.innerHTML = `
          <button onclick="window.removeCarBet(${idx})" class="absolute top-2 right-2 text-slate-300 hover:text-rose-500 font-black text-lg h-6 w-6 flex items-center justify-center leading-none">&times;</button>
          <div class="flex items-center gap-2 mb-2">
            <span class="w-7 h-7 bg-blue-100 text-blue-700 font-black rounded flex items-center justify-center">${bet.num}</span>
            <span class="text-sm font-bold text-slate-700">下注 ${bet.amount} 車</span>
          </div>
          <div class="flex justify-between items-center text-xs text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100 mr-6">
            <div>收: <span class="font-bold text-slate-800">$${Math.round(coll).toLocaleString()}</span></div>
            <div>本: <span class="font-bold text-slate-800">$${Math.round(cost).toLocaleString()}</span></div>
            <div class="text-emerald-600 font-black">賺: +$${Math.round(water).toLocaleString()}</div>
          </div>
          ${hitBadge}
        `;
        cardContainer.appendChild(card);
      });

      if (carBets.length === 0) {
        cardContainer.innerHTML = `<div class="text-center text-slate-400 text-xs py-4">目前無坐車清單</div>`;
      }

      document.getElementById('carTotalCars').textContent = tCars.toFixed(2) + ' 車';
      document.getElementById('carTotalCollect').textContent = Math.round(tColl).toLocaleString() + ' 元';
      document.getElementById('carTotalWater').textContent = '+' + Math.round(tWater).toLocaleString() + ' 元';
      document.getElementById('carTotalPayout').textContent = Math.round(tPayout).toLocaleString() + ' 元';

      const payoutWrap = document.getElementById('carTotalPayoutWrapper');
      if (tPayout > 0) { payoutWrap.classList.remove('hidden'); } else { payoutWrap.classList.add('hidden'); }

      window.currentCarCalc = { tCars, tColl: Math.round(tColl), tCost: Math.round(tCost), tWater: Math.round(tWater), tPayout: Math.round(tPayout), bets: [...carBets] };
    };

    window.saveCarBetRecord = async function() {
      const calc = window.currentCarCalc;
      if (!calc || calc.tCars === 0) return alert('請加入清單！');
      const date = document.getElementById('carBetDate').value;
      const cust = document.getElementById('carCustName').value.trim() || '未具名';
      const nums = calc.bets.map(b => `${b.num}(${b.amount})`).join(' ');
      try {
        await addDoc(collection(db, "ledger_records"), {
          date: date, cust: cust, game: '全車', detail: nums, amountLabel: `${calc.tCars.toFixed(2)}車`,
          collect: calc.tColl, cost: calc.tCost, water: calc.tWater, payout: calc.tPayout, createdAt: Date.now()
        });
        alert('✅ 下注已存入雲端！');
      } catch(e) { alert('寫入失敗'); }
    };

    // 帳本卡片化渲染
    window.renderLedger = function() {
      const filterDate = document.getElementById('ledgerFilterDate').value;
      const listContainer = document.getElementById('ledgerCardList');
      listContainer.innerHTML = '';
      
      const filtered = filterDate ? ledgerRecords.filter(r => r.date === filterDate) : ledgerRecords;
      let sumColl = 0, sumCost = 0, sumWater = 0;

      filtered.forEach(rec => {
        sumColl += rec.collect; sumCost += rec.cost; sumWater += rec.water;
        
        let payoutHTML = '';
        if (rec.payout > 0) {
          payoutHTML = `
            <div class="mt-2 bg-rose-50 border border-rose-100 p-2 rounded flex justify-between items-center">
              <span class="text-rose-600 font-bold text-xs">🎉 派彩</span>
              <span class="text-rose-600 font-black text-sm">$${rec.payout.toLocaleString()}</span>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm relative";
        card.innerHTML = `
          <div class="flex justify-between items-center mb-1.5 pr-8">
            <span class="text-[10px] text-slate-400 font-bold bg-slate-100 px-1.5 py-0.5 rounded">${rec.date.substring(5)}</span>
            <span class="font-black text-slate-800 text-sm truncate">${rec.cust}</span>
          </div>
          <button onclick="window.deleteRecord('${rec.id}')" class="absolute top-2.5 right-2.5 text-[10px] bg-rose-50 text-rose-500 font-bold px-2 py-1 rounded shadow-sm active:bg-rose-100">刪除</button>
          
          <div class="mb-2">
            <div class="text-xs font-bold text-slate-700">${rec.game} <span class="text-slate-400 font-normal">(${rec.amountLabel})</span></div>
            <div class="text-[10px] text-slate-500 leading-tight mt-0.5 break-words">${rec.detail}</div>
          </div>

          <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg border border-slate-100">
            <div class="text-slate-500">收: <span class="font-bold text-slate-800">${rec.collect.toLocaleString()}</span></div>
            <div class="text-emerald-600 font-black">水: +${rec.water.toLocaleString()}</div>
          </div>
          ${payoutHTML}
        `;
        listContainer.appendChild(card);
      });

      if(filtered.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-slate-400 text-xs py-6">此日期無帳目資料</div>';
      }

      document.getElementById('ledgerCountDisplay').textContent = `${filtered.length} 筆`;
      document.getElementById('ledgerCollectDisplay').textContent = sumColl.toLocaleString() + ' 元';
      document.getElementById('ledgerWaterDisplay').textContent = '+' + sumWater.toLocaleString() + ' 元';
    };

    window.resetLedgerFilter = function() {
      document.getElementById('ledgerFilterDate').value = '';
      window.renderLedger();
    };

    window.deleteRecord = async function(id) {
      if(!confirm('確定要從雲端刪除這筆紀錄嗎？')) return;
      try { await deleteDoc(doc(db, "ledger_records", id)); } catch(e) { alert('刪除失敗'); }
    };

    // LINE 複製
    function copyToClipboard(text) { navigator.clipboard.writeText(text).then(()=>alert('✅ 已複製！')).catch(()=>alert('複製失敗')); }
    window.copyStarBetSummary = function() {
      const calc = window.currentStarCalc;
      if (!calc || calc.tPairs === 0) return alert('無下注！');
      let text = `【連碰下注】\n日期：${document.getElementById('starBetDate').value}\n客戶：${document.getElementById('starCustName').value||'老闆'}\n玩法：${calc.rulesInfo}\n號碼：${calc.balls.join(', ')}\n總計：${calc.tPairs}碰\n------------------\n💰應收：${calc.tColl.toLocaleString()} 元\n為您確認下注，祝中大獎！`;
      copyToClipboard(text);
    };
    window.copyStarPayoutSummary = function() {
      const calc = window.currentStarCalc;
      let text = `【連碰派彩】\n開獎：${window.currentDrawnNumbers.join(',')}\n命中：${calc.hits.join(',')||'無'} (中${calc.hitCount}顆)\n------------------\n💰中獎彩金：${calc.tPayout.toLocaleString()} 元`;
      copyToClipboard(text);
    };
    window.copyCarBetSummary = function() {
      const calc = window.currentCarCalc;
      if (!calc || calc.tCars === 0) return alert('無下注！');
      let text = `【全車下注】\n日期：${document.getElementById('carBetDate').value}\n客戶：${document.getElementById('carCustName').value||'老闆'}\n`;
      calc.bets.forEach(b => text += `[${b.num}] ➔ ${b.amount}車\n`);
      text += `------------------\n總計：${calc.tCars.toFixed(2)}車\n💰應收：${calc.tColl.toLocaleString()} 元\n為您確認下注！`;
      copyToClipboard(text);
    };
    window.copyCarPayoutSummary = function() {
      const calc = window.currentCarCalc;
      let text = `【全車派彩】\n開獎：${window.currentDrawnNumbers.join(',')}\n------------------\n`;
      calc.bets.forEach(b => { text += `[${b.num}] (${b.amount}車)：${window.currentDrawnNumbers.includes(b.num) ? '🎉中獎' : '未中'}\n`; });
      text += `------------------\n💰中獎彩金：${calc.tPayout.toLocaleString()} 元`;
      copyToClipboard(text);
    };

    // 初始化
    initKeypads();
    window.calculateStars();
    window.renderCarBets();
  </script>
</body>
</html>

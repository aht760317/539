<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天天樂 AI vs 直覺 預測對決統計表</title>
    <style>
        :root {
            --bg-color: #f0fdf4; 
            --panel-bg: #ffffff;
            --text-main: #1e293b;
            --ai-color: #3b82f6; 
            --my-color: #10b981; 
            --draw-color: #f59e0b; 
            --hit-color: #ef4444; 
            --cold-color: #0ea5e9;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }

        header { background: #1e293b; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 26px; }

        /* 統計戰力板 */
        .stats-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; position: relative; overflow: hidden; }
        .stat-card.ai-card { border-bottom: 5px solid var(--ai-color); }
        .stat-card.my-card { border-bottom: 5px solid var(--my-color); }
        .stat-card.pk-card { border-bottom: 5px solid var(--hit-color); background: #fef2f2; }
        .stat-title { font-size: 14px; color: #64748b; font-weight: bold; }
        .stat-value { font-size: 32px; font-weight: 900; margin: 10px 0; }
        .stat-sub { font-size: 13px; color: #94a3b8; }

        /* 冷熱門數據 & 搖號機 區塊 */
        .tools-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .tool-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tool-card h3 { font-size: 16px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        
        .badge-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .info-badge { display: flex; flex-direction: column; align-items: center; background: #f1f5f9; padding: 6px 10px; border-radius: 8px; min-width: 45px;}
        .info-badge .num { font-size: 18px; font-weight: bold; }
        .info-badge .desc { font-size: 11px; color: #64748b; margin-top: 2px; }
        .hot-badge .num { color: var(--hit-color); }
        .cold-badge .num { color: var(--cold-color); }

        /* ====================================================
           🌟 全新物理引擎搖號機 CSS 🌟 
        ==================================================== */
        .machine-container { display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 20px; }
        
        .realistic-machine { position: relative; width: 180px; height: 180px; margin-top: 20px; }
        
        /* 玻璃圓缸背景 */
        .glass-sphere { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%); border: 4px solid #cbd5e1; position: absolute; top: 0; left: 0; }
        
        /* 玻璃圓缸的高光反射層 (蓋在球上方，增加立體感) */
        .glass-overlay { width: 100%; height: 100%; border-radius: 50%; position: absolute; top: 0; left: 0; box-shadow: inset -15px -15px 25px rgba(0,0,0,0.2), inset 10px 10px 20px rgba(255,255,255,0.9); pointer-events: none; z-index: 10; }
        
        /* 頂部吸管 */
        .suction-tube { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 34px; height: 50px; background: linear-gradient(to right, rgba(255,255,255,0.8), rgba(200,215,230,0.4), rgba(255,255,255,0.8)); border: 2px solid #94a3b8; border-bottom: none; border-radius: 8px 8px 0 0; z-index: 15; box-shadow: inset 0 5px 10px rgba(0,0,0,0.1); }
        
        /* 底座 */
        .machine-base { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); width: 100px; height: 25px; background: #334155; border-radius: 5px; z-index: 12; box-shadow: 0 5px 10px rgba(0,0,0,0.3); }

        /* 裡面碰撞的小球 */
        .mini-ball { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fef08a, #f59e0b); color: #78350f; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; top: 0; left: 0; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.4), 1px 1px 3px rgba(0,0,0,0.2); z-index: 5; /* 預設不開起動畫，由 JS 高頻刷新位置 */ transition: transform 0s, opacity 0.5s; }

        /* 開獎槽與落下的結果球 */
        .machine-balls { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #f1f5f9; border-radius: 30px; box-shadow: inset 0 3px 6px rgba(0,0,0,0.1); }
        .machine-ball { width: 45px; height: 45px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border: 2px dashed #cbd5e1; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .machine-ball.revealed { background: linear-gradient(135deg, #fde68a 0%, #f59e0b 100%); color: white; border: 2px solid #b45309; box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 -3px 5px rgba(0,0,0,0.1); text-shadow: 1px 1px 2px rgba(0,0,0,0.3); transform: scale(1.15); }

        .btn-roll { background: #8b5cf6; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-roll:hover { background: #7c3aed; transform: translateY(-2px); }
        .btn-roll:active { transform: translateY(0); }
        .btn-roll:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }
        
        .btn-apply { background: var(--my-color); color: white; border: none; padding: 12px 18px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-left: 10px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-apply:hover { background: #059669; }

        /* 輸入區與歷史區 (同之前) */
        .input-panel { background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-panel h2 { margin-bottom: 15px; font-size: 18px; color: #334155; border-left: 4px solid var(--draw-color); padding-left: 10px; }
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 14px; font-weight: bold; }
        .form-group input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; outline: none; }
        .form-group input:focus { border-color: var(--ai-color); }
        
        .btn-submit { width: 100%; background: #0f172a; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #334155; }

        .history-panel { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: #f1f5f9; padding: 12px; border-bottom: 2px solid var(--border); font-weight: bold; }
        td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background: #f8fafc; }

        .num-container { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
        .num-ball { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; background: #e2e8f0; color: #475569; }
        .num-ball.hit { background: var(--hit-color); color: white; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); transform: scale(1.1); }
        .num-ball.draw { background: var(--draw-color); color: white; }

        .winner-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; display: inline-block;}
        .badge-ai { background: var(--ai-color); }
        .badge-my { background: var(--my-color); }
        .badge-tie { background: #94a3b8; }
        .badge-solo { background: #64748b; } 
        .badge-pending { background: #f59e0b; } 
        
        .action-btn { padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; font-size: 12px; margin: 2px; }
        .delete-btn { background: #f1f5f9; color: #ef4444; }
        .delete-btn:hover { background: #fee2e2; }
        .update-btn { background: var(--draw-color); color: white; border: none; font-weight: bold; }
        .update-btn:hover { background: #d97706; }
        .edit-btn { background: #e2e8f0; color: #1e293b; }
        .edit-btn:hover { background: #cbd5e1; }
        
        .pending-input { padding: 6px; border: 1px solid var(--draw-color); border-radius: 4px; width: 140px; margin-bottom: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚔️ 天天樂 (39選5) 預測對決擂台</h1>
        <p>AI 大數據 vs 人類直覺！究竟誰的勝率高？</p>
    </header>

    <div class="stats-board">
        <!-- 戰力板維持不變 -->
        <div class="stat-card">
            <div class="stat-title">已開獎期數</div>
            <div class="stat-value" id="total-rounds">0</div>
            <div class="stat-sub">有效結算的期數</div>
        </div>
        <div class="stat-card ai-card">
            <div class="stat-title" style="color:var(--ai-color)">🤖 AI 總命中球數</div>
            <div class="stat-value" id="ai-hits" style="color:var(--ai-color)">0</div>
            <div class="stat-sub">平均每期命中：<span id="ai-avg">0.00</span> 顆</div>
        </div>
        <div class="stat-card my-card">
            <div class="stat-title" style="color:var(--my-color)">🧑 我 總命中球數</div>
            <div class="stat-value" id="my-hits" style="color:var(--my-color)">0</div>
            <div class="stat-sub">實際參與 <span id="my-rounds">0</span> 期 (平均：<span id="my-avg">0.00</span> 顆)</div>
        </div>
        <div class="stat-card pk-card">
            <div class="stat-title" style="color:var(--hit-color)">🏆 目前勝率霸主</div>
            <div class="stat-value" id="pk-winner" style="color:var(--hit-color); font-size:24px;">平手</div>
            <div class="stat-sub">根據平均命中數判定</div>
        </div>
    </div>

    <!-- 冷熱門與物理搖號機 -->
    <div class="tools-panel">
        <div class="tool-card">
            <h3 style="color:var(--hit-color)">🔥 前八名 常開熱門號</h3>
            <div class="badge-list" id="hot-numbers">
                <div style="font-size:13px; color:#94a3b8;">累積開獎資料後顯示...</div>
            </div>
            
            <h3 style="color:var(--cold-color); margin-top:20px;">❄️ 前八名 最久未開冷門號</h3>
            <div class="badge-list" id="cold-numbers">
                <div style="font-size:13px; color:#94a3b8;">累積開獎資料後顯示...</div>
            </div>
        </div>

        <div class="tool-card">
            <h3 style="color:#8b5cf6">🎰 3D 物理滾球搖號機</h3>
            <div class="machine-container">
                
                <!-- 逼真的 3D 搖號機 -->
                <div class="realistic-machine">
                    <div class="suction-tube"></div>
                    <div class="glass-sphere" id="physics-container">
                        <!-- JS 動態產生 39 顆球 -->
                    </div>
                    <div class="glass-overlay"></div>
                    <div class="machine-base"></div>
                </div>
                
                <!-- 開獎落球槽 -->
                <div class="machine-balls" id="machine-balls">
                    <div class="machine-ball">?</div>
                    <div class="machine-ball">?</div>
                    <div class="machine-ball">?</div>
                    <div class="machine-ball">?</div>
                    <div class="machine-ball">?</div>
                </div>
                
                <div style="margin-top: 5px;">
                    <button class="btn-roll" id="btn-roll" onclick="startRoll()">🌪️ 啟動搖號機</button>
                    <button class="btn-apply" id="btn-apply" onclick="applyMachineNumbers()">📥 將前4碼帶入我的預測</button>
                </div>
            </div>
        </div>
    </div>

    <div class="input-panel">
        <h2>📝 新增今日對決預測</h2>
        <div class="form-row">
            <div class="form-group" style="flex: 0.5;">
                <label>📅 日期</label>
                <input type="date" id="input-date">
            </div>
            <div class="form-group">
                <label style="color:var(--ai-color)">🤖 AI 的 4 個號碼 (必填)</label>
                <input type="text" id="ai-nums" placeholder="例: 05, 12, 28, 33">
            </div>
            <div class="form-group">
                <label style="color:var(--my-color)">🧑 我挑的 4 個號碼 (不參與請留空)</label>
                <input type="text" id="my-nums" placeholder="若無靈感可不填...">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label style="color:var(--draw-color)">📺 實際開獎 5 個號碼 (可留空，等晚上 10 點後再回填)</label>
                <input type="text" id="draw-nums" placeholder="若還沒開獎請留空，按下方按鈕先存檔">
            </div>
        </div>
        <button class="btn-submit" onclick="addRecord()">✅ 儲存預測 (若有填開獎號碼則自動對獎)</button>
    </div>

    <div class="history-panel">
        <h2 style="font-size: 18px; margin-bottom: 15px;">📊 歷史戰績對照表</h2>
        <table>
            <thead>
                <tr>
                    <th>📅 日期</th>
                    <th>🤖 AI預測</th>
                    <th>🧑 我的預測</th>
                    <th>📺 實際開出 5 碼</th>
                    <th>單期勝負</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="history-tbody">
                </tbody>
        </table>
    </div>
</div>

<script>
    /* =========================================================
       系統核心邏輯 (記錄、結算、冷熱門)
    ========================================================= */
    let battleHistory = [];

    function sortHistoryByDate() {
        battleHistory.sort((a, b) => {
            let dateA = new Date(a.date);
            let dateB = new Date(b.date);
            if (dateB - dateA === 0) return b.id - a.id; 
            return dateB - dateA;
        });
    }

    window.onload = function() {
        document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
        if (localStorage.getItem('tt5_battle_history')) {
            battleHistory = JSON.parse(localStorage.getItem('tt5_battle_history'));
            sortHistoryByDate(); 
        }
        renderAll();
        initPhysicsMachine(); // 啟動物理引擎
    };

    function parseNumbers(inputStr) {
        if (!inputStr || inputStr.trim() === "") return [];
        let nums = inputStr.match(/\d+/g);
        if (!nums) return [];
        nums = nums.map(n => parseInt(n, 10)).filter(n => n >= 1 && n <= 39);
        nums = [...new Set(nums)].sort((a, b) => a - b);
        return nums;
    }

    function calculateResult(aiNums, myNums, drawNums) {
        let aiHitCount = aiNums.filter(n => drawNums.includes(n)).length;
        let myHitCount = 0;
        let winner = "平手";

        if (myNums.length === 0) {
            winner = "僅 AI";
        } else {
            myHitCount = myNums.filter(n => drawNums.includes(n)).length;
            if (aiHitCount > myHitCount) winner = "AI 勝";
            else if (myHitCount > aiHitCount) winner = "我 勝";
        }
        return { aiHitCount, myHitCount, winner };
    }

    function addRecord() {
        let date = document.getElementById('input-date').value;
        let aiInput = document.getElementById('ai-nums').value;
        let myInput = document.getElementById('my-nums').value;
        let drawInput = document.getElementById('draw-nums').value;

        let aiNums = parseNumbers(aiInput);
        let myNums = parseNumbers(myInput);
        let drawNums = parseNumbers(drawInput);

        if (aiNums.length !== 4) return alert("🤖 AI 的號碼必須剛好是 4 個不重複的數字 (1-39)！");
        if (myInput.trim() !== "" && myNums.length !== 4) return alert("🧑 你的號碼如果有填，必須剛好是 4 碼！");
        if (drawInput.trim() !== "" && drawNums.length !== 5) return alert("📺 實際開獎號碼如果有填，必須剛好是 5 個不重複的數字！");

        let isPending = drawNums.length === 0;
        let aiHitCount = 0, myHitCount = 0, winner = "等待開獎";

        if (!isPending) {
            let res = calculateResult(aiNums, myNums, drawNums);
            aiHitCount = res.aiHitCount;
            myHitCount = res.myHitCount;
            winner = res.winner;
        }

        let record = { id: Date.now(), date: date, ai: aiNums, my: myNums, draw: drawNums, aiHits: aiHitCount, myHits: myHitCount, winner: winner, isPending: isPending };

        battleHistory.push(record);
        sortHistoryByDate(); 
        localStorage.setItem('tt5_battle_history', JSON.stringify(battleHistory));

        document.getElementById('ai-nums').value = "";
        document.getElementById('my-nums').value = "";
        document.getElementById('draw-nums').value = "";
        renderAll();
    }

    function updateDraw(id) {
        let inputEl = document.getElementById(`draw-update-${id}`);
        let drawNums = parseNumbers(inputEl.value);

        if (drawNums.length !== 5) return alert("📺 開獎號碼必須輸入 5 個不重複的數字 (1-39)！");

        let index = battleHistory.findIndex(item => item.id === id);
        if (index !== -1) {
            let record = battleHistory[index];
            record.draw = drawNums;
            record.isPending = false;
            
            let res = calculateResult(record.ai, record.my, record.draw);
            record.aiHits = res.aiHitCount;
            record.myHits = res.myHitCount;
            record.winner = res.winner;

            localStorage.setItem('tt5_battle_history', JSON.stringify(battleHistory));
            renderAll();
        }
    }

    function editDate(id, oldDate) {
        let newDate = prompt("請輸入修正後的日期 (格式：YYYY-MM-DD)", oldDate);
        if (newDate && newDate.trim() !== "") {
            let index = battleHistory.findIndex(item => item.id === id);
            if (index !== -1) {
                battleHistory[index].date = newDate.trim();
                sortHistoryByDate(); 
                localStorage.setItem('tt5_battle_history', JSON.stringify(battleHistory));
                renderAll();
            }
        }
    }

    function deleteRecord(id) {
        if (confirm("確定刪除這筆紀錄？")) {
            battleHistory = battleHistory.filter(item => item.id !== id);
            localStorage.setItem('tt5_battle_history', JSON.stringify(battleHistory));
            renderAll();
        }
    }

    function analyzeHotColdNumbers() {
        let completedDraws = battleHistory.filter(item => !item.isPending);
        if(completedDraws.length === 0) return;

        let numStats = {};
        for(let i = 1; i <= 39; i++) {
            numStats[i] = { num: i, count: 0, lastSeenAgo: 999 };
        }

        completedDraws.forEach((record, index) => {
            record.draw.forEach(n => {
                numStats[n].count++;
                if (numStats[n].lastSeenAgo === 999) {
                    numStats[n].lastSeenAgo = index; 
                }
            });
        });

        let statsArray = Object.values(numStats);
        let hotNumbers = [...statsArray].sort((a, b) => {
            if (b.count !== a.count) return b.count - a.count;
            return a.lastSeenAgo - b.lastSeenAgo;
        }).slice(0, 8);

        let coldNumbers = [...statsArray].sort((a, b) => b.lastSeenAgo - a.lastSeenAgo).slice(0, 8);

        document.getElementById('hot-numbers').innerHTML = hotNumbers.map(item => `
            <div class="info-badge hot-badge"><span class="num">${item.num.toString().padStart(2, '0')}</span><span class="desc">開${item.count}次</span></div>
        `).join('');

        document.getElementById('cold-numbers').innerHTML = coldNumbers.map(item => `
            <div class="info-badge cold-badge"><span class="num">${item.num.toString().padStart(2, '0')}</span><span class="desc">${item.lastSeenAgo === 999 ? '未開過' : '漏'+item.lastSeenAgo+'期'}</span></div>
        `).join('');
    }

    /* =========================================================
       🔥🔥 真實物理碰撞搖號機引擎 (JS Physics) 🔥🔥
    ========================================================= */
    const SPHERE_SIZE = 180;
    const CENTER = SPHERE_SIZE / 2;
    const BALL_RADIUS = 11; // 22px 寬高
    const MAX_RADIUS = CENTER - BALL_RADIUS - 4; // 邊界碰撞範圍

    let physicsBalls = [];
    let isMixing = false;
    let finalMachineNumbers = [];
    let reqFrame;

    function initPhysicsMachine() {
        const container = document.getElementById('physics-container');
        container.innerHTML = ''; // 清空
        physicsBalls = [];

        // 產生 39 顆球
        for (let i = 1; i <= 39; i++) {
            let el = document.createElement('div');
            el.className = 'mini-ball';
            el.innerText = i.toString().padStart(2, '0');
            container.appendChild(el);
            
            // 隨機初始位置 (在圓形下半部)
            let angle = Math.random() * Math.PI; // 0 ~ PI (下方)
            let r = Math.random() * (MAX_RADIUS - 10);
            let x = CENTER + Math.cos(angle) * r;
            let y = CENTER + Math.sin(angle) * r;

            physicsBalls.push({
                id: i, el: el, active: true,
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4
            });
        }

        // 啟動物理循環 (避免重複啟動)
        if (reqFrame) cancelAnimationFrame(reqFrame);
        physicsLoop();
    }

    function physicsLoop() {
        physicsBalls.forEach(b => {
            if (!b.active) return; // 被吸走的球不參與物理計算

            // 1. 套用重力 (Gravity)
            b.vy += 0.4; 

            // 2. 攪拌模式：加入隨機狂暴推力
            if (isMixing) {
                b.vx += (Math.random() - 0.5) * 4;
                b.vy -= (Math.random()) * 2; // 底部向上吹風
                
                // 限制最高速度避免飛穿邊界
                let speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                if (speed > 18) {
                    b.vx = (b.vx / speed) * 18;
                    b.vy = (b.vy / speed) * 18;
                }
            } else {
                // 平靜狀態：加上空氣阻力慢慢停下
                b.vx *= 0.98;
                b.vy *= 0.98;
            }

            // 更新位置
            b.x += b.vx;
            b.y += b.vy;

            // 3. 邊界圓形碰撞檢查 (Boundary Collision)
            let dx = b.x - CENTER;
            let dy = b.y - CENTER;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > MAX_RADIUS) {
                // 正規化法向量
                let nx = dx / dist;
                let ny = dy / dist;
                
                // 把球推回邊界內
                b.x = CENTER + nx * MAX_RADIUS;
                b.y = CENTER + ny * MAX_RADIUS;
                
                // 反射速度向量 (彈性係數 0.8)
                let dot = b.vx * nx + b.vy * ny;
                b.vx = (b.vx - 2 * dot * nx) * 0.8;
                b.vy = (b.vy - 2 * dot * ny) * 0.8;
            }
        });

        // 4. 球與球之間的簡易互相碰撞排斥 (O(N^2) 檢查，39顆算很快)
        for(let i = 0; i < physicsBalls.length; i++) {
            if(!physicsBalls[i].active) continue;
            for(let j = i + 1; j < physicsBalls.length; j++) {
                if(!physicsBalls[j].active) continue;
                
                let b1 = physicsBalls[i];
                let b2 = physicsBalls[j];
                let dx = b1.x - b2.x;
                let dy = b1.y - b2.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let minDist = BALL_RADIUS * 2;

                if(dist < minDist && dist > 0) {
                    let overlap = minDist - dist;
                    let nx = dx / dist;
                    let ny = dy / dist;
                    
                    // 把球推開避免重疊
                    b1.x += nx * overlap * 0.5;
                    b1.y += ny * overlap * 0.5;
                    b2.x -= nx * overlap * 0.5;
                    b2.y -= ny * overlap * 0.5;
                    
                    // 簡易動量交換 (互撞反彈)
                    let dvx = b1.vx - b2.vx;
                    let dvy = b1.vy - b2.vy;
                    let dot = dvx * nx + dvy * ny;
                    if (dot < 0) { 
                        b1.vx -= nx * dot * 0.8;
                        b1.vy -= ny * dot * 0.8;
                        b2.vx += nx * dot * 0.8;
                        b2.vy += ny * dot * 0.8;
                    }
                }
            }
        }

        // 5. 畫面渲染 Render
        physicsBalls.forEach(b => {
            if (b.active) {
                b.el.style.transform = `translate(${b.x - BALL_RADIUS}px, ${b.y - BALL_RADIUS}px)`;
            }
        });

        reqFrame = requestAnimationFrame(physicsLoop);
    }

    // 執行「吸出一顆球」的動畫
    function drawOneBallAction(ballObj, slotIndex, callback) {
        ballObj.active = false; // 脫離物理引擎控制
        
        // 設定 CSS 動畫接管位置 (吸入頂部的管子)
        ballObj.el.style.transition = "transform 0.6s cubic-bezier(0.5, -0.5, 0.2, 1.2), opacity 0.8s";
        // 目標：X置中, Y=-25 (管子內)
        ballObj.el.style.transform = `translate(${CENTER - BALL_RADIUS}px, -25px) scale(1.4)`;
        
        setTimeout(() => {
            ballObj.el.style.opacity = "0"; // 消失
            
            // 下方對應的球槽爆出結果
            let slots = document.querySelectorAll('.machine-ball');
            slots[slotIndex].innerText = ballObj.id.toString().padStart(2, '0');
            slots[slotIndex].classList.add('revealed');
            
            if (callback) callback();
        }, 700);
    }

    // 啟動開獎流程 (Async/Await 控制節奏)
    async function startRoll() {
        const btnRoll = document.getElementById('btn-roll');
        const btnApply = document.getElementById('btn-apply');
        const resultSlots = document.querySelectorAll('.machine-ball');
        
        // 鎖定按鈕與UI
        btnRoll.disabled = true;
        btnRoll.innerText = "🌪️ 彩球瘋狂攪拌中...";
        btnApply.style.display = "none";
        
        // 重置機台
        initPhysicsMachine();
        resultSlots.forEach(slot => {
            slot.innerText = "?";
            slot.classList.remove('revealed');
        });
        
        // 啟動狂暴攪拌模式
        isMixing = true;
        
        // 讓球滾動 1.5 秒營造氣氛
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        // 電腦暗箱操作決定幸運的 5 碼 (先排好序)
        finalMachineNumbers = [];
        while(finalMachineNumbers.length < 5) {
            let r = Math.floor(Math.random() * 39) + 1;
            if(!finalMachineNumbers.includes(r)) finalMachineNumbers.push(r);
        }
        finalMachineNumbers.sort((a, b) => a - b);
        
        // 依序吸出 5 顆球
        for(let i = 0; i < 5; i++) {
            let targetNum = finalMachineNumbers[i];
            let ballObj = physicsBalls.find(b => b.id === targetNum);
            
            await new Promise(resolve => {
                drawOneBallAction(ballObj, i, () => {
                    // 吸完一顆，等 0.5 秒再吸下一顆
                    setTimeout(resolve, 500); 
                });
            });
        }
        
        // 抽獎結束，平息攪拌
        isMixing = false;
        btnRoll.disabled = false;
        btnRoll.innerText = "🎲 重新啟動搖號";
        btnApply.style.display = "inline-block";
    }

    // 帶入前4碼
    function applyMachineNumbers() {
        if(finalMachineNumbers.length >= 4) {
            let my4Nums = finalMachineNumbers.slice(0, 4); 
            document.getElementById('my-nums').value = my4Nums.map(n => n.toString().padStart(2, '0')).join(', ');
            alert("✅ 已經將前 4 個幸運號碼帶入您的預測欄位！");
        }
    }

    // 表格渲染
    function renderAll() {
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = '';

        let totalRounds = 0, myRounds = 0, totalAiHits = 0, totalMyHits = 0;
        analyzeHotColdNumbers();

        battleHistory.forEach(item => {
            if (!item.isPending) {
                totalRounds++;
                totalAiHits += item.aiHits;
                if (item.my && item.my.length === 4) {
                    myRounds++;
                    totalMyHits += item.myHits || 0;
                }
            }

            const tr = document.createElement('tr');
            const genBalls = (nums) => `<div class="num-container">` + nums.map(n => {
                let isHit = (!item.isPending && item.draw.includes(n)) ? 'hit' : '';
                return `<div class="num-ball ${isHit}">${n.toString().padStart(2,'0')}</div>`;
            }).join('') + `</div>`;
            const genDrawBalls = (nums) => `<div class="num-container">` + nums.map(n => `<div class="num-ball draw">${n.toString().padStart(2,'0')}</div>`).join('') + `</div>`;

            let myColumnHtml = item.my && item.my.length === 4 
                ? genBalls(item.my) + (!item.isPending ? `<div style="font-size:12px; margin-top:5px; color:#ef4444;">中 ${item.myHits} 顆</div>` : '')
                : `<div style="color: #94a3b8; font-size: 14px; padding: 10px 0;">休息未預測 ☕</div>`;

            let drawColumnHtml = item.isPending 
                ? `<div><input type="text" id="draw-update-${item.id}" class="pending-input" placeholder="輸入 5 個開獎號碼"><br><button class="action-btn update-btn" onclick="updateDraw(${item.id})">確認開獎</button></div>`
                : genDrawBalls(item.draw);

            let winnerBadge = `<span class="winner-badge badge-tie">平手</span>`;
            if (item.isPending) winnerBadge = `<span class="winner-badge badge-pending">⏳ 等待開獎</span>`;
            else if (item.winner === "AI 勝") winnerBadge = `<span class="winner-badge badge-ai">🤖 AI 勝</span>`;
            else if (item.winner === "我 勝") winnerBadge = `<span class="winner-badge badge-my">🧑 我 勝</span>`;
            else if (item.winner === "僅 AI") winnerBadge = `<span class="winner-badge badge-solo">🤖 僅 AI</span>`;

            tr.innerHTML = `
                <td><strong>${item.date}</strong></td>
                <td>${genBalls(item.ai)} ${!item.isPending ? `<div style="font-size:12px; margin-top:5px; color:#ef4444;">中 ${item.aiHits} 顆</div>` : ''}</td>
                <td>${myColumnHtml}</td>
                <td>${drawColumnHtml}</td>
                <td>${winnerBadge}</td>
                <td style="min-width: 100px;">
                    <button class="action-btn edit-btn" onclick="editDate(${item.id}, '${item.date}')">📅 改期</button>
                    <button class="action-btn delete-btn" onclick="deleteRecord(${item.id})">刪除</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        if (battleHistory.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="padding: 30px; color: #94a3b8;">目前尚無紀錄，趕快輸入今天的第一筆對決吧！</td></tr>`;
        }

        document.getElementById('total-rounds').innerText = totalRounds;
        document.getElementById('ai-hits').innerText = totalAiHits;
        document.getElementById('my-hits').innerText = totalMyHits;
        document.getElementById('my-rounds').innerText = myRounds;
        
        let aiAvg = totalRounds > 0 ? (totalAiHits / totalRounds) : 0;
        let myAvg = myRounds > 0 ? (totalMyHits / myRounds) : 0;
        document.getElementById('ai-avg').innerText = aiAvg.toFixed(2);
        document.getElementById('my-avg').innerText = myAvg.toFixed(2);

        let pkEl = document.getElementById('pk-winner');
        if (totalRounds === 0) {
             pkEl.innerText = "等待開獎";
             pkEl.style.color = "var(--draw-color)";
        } else if (aiAvg > myAvg) {
            pkEl.innerText = "🤖 AI 領先";
            pkEl.style.color = "var(--ai-color)";
        } else if (myAvg > aiAvg) {
            pkEl.innerText = "🧑 人類(你)領先";
            pkEl.style.color = "var(--my-color)";
        } else {
            pkEl.innerText = "平分秋色";
            pkEl.style.color = "var(--hit-color)";
        }
    }
</script>
